name: Convertir CSV a Excel Automatico

on:
  push:
    paths:
      - 'ARCHIVOS/registro_incidencias.csv'

jobs:
  convertir_a_excel:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Pandas y OpenPyXL
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Convertir CSV a XLSX
        run: |
          python -c "
          import pandas as pd
          import os

          csv_path = 'ARCHIVOS/registro_incidencias.csv'
          xlsx_path = 'ARCHIVOS/registro_incidencias.xlsx'

          if os.path.exists(csv_path):
              df = pd.read_csv(csv_path, sep=',', encoding='utf-8-sig')
              with pd.ExcelWriter(xlsx_path, engine='openpyxl') as writer:
                  df.to_excel(writer, sheet_name='REGISTROS', index=False)
              print('✅ Archivo XLSX actualizado exitosamente.')
          "

      - name: Guardar Cambios en GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add ARCHIVOS/registro_incidencias.xlsx
          git commit -m "Auto-generación de registro_incidencias.xlsx desde CSV" || exit 0
          git push
