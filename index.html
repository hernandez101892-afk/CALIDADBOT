<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Quality Control Terminal - Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #0b0f14;
      --card-bg: rgba(18, 26, 36, 0.92);
      --border-cyan: #00f0ff;
      --amber-alert: #ffb703;
      --danger-red: #ff3366;
      --success-green: #00e676;
      --text-main: #e2e8f0;
      --text-muted: #8a99ad;
    }

    body {
      font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 20px 20px, 20px 20px;
      color: var(--text-main);
      margin: 0;
      padding: 14px;
      box-sizing: border-box;
    }

    /* Franja Superior Estilo Planta */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: linear-gradient(90deg, rgba(0, 240, 255, 0.15), transparent);
      border-left: 4px solid var(--border-cyan);
      border-radius: 4px;
      margin-bottom: 14px;
    }
    .top-bar .title {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--border-cyan);
      text-transform: uppercase;
    }
    .top-bar .status {
      font-size: 0.7rem;
      color: var(--success-green);
      font-weight: 700;
      background: rgba(0, 230, 118, 0.1);
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid rgba(0, 230, 118, 0.3);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      position: relative;
      overflow: hidden;
    }

    /* Línea estriada industrial superior */
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: repeating-linear-gradient(
        45deg,
        var(--amber-alert),
        var(--amber-alert) 10px,
        #121a24 10px,
        #121a24 20px
      );
    }

    h2 {
      margin: 6px 0 16px 0;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      display: block;
      margin-top: 12px;
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background-color: rgba(10, 15, 22, 0.8);
      color: #ffffff;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--border-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
      background-color: rgba(15, 23, 34, 0.95);
    }

    .row { display: flex; gap: 10px; }
    .col { flex: 1; }

    /* Botón Escáner QR */
    .btn-qr {
      width: 100%;
      background: linear-gradient(135deg, #00c853, #009624);
      color: #ffffff;
      font-weight: 800;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 200, 83, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-qr:active { transform: scale(0.98); }

    /* Botón Guardar Principal */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #00d2ff, #0088cc);
      color: #0b0f14;
      font-weight: 900;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      cursor: pointer;
      margin-top: 18px;
      box-shadow: 0 4px 20px rgba(0, 210, 255, 0.4);
    }
    .btn-submit:active { transform: scale(0.98); }

    /* Contenedor Alerta Scrap */
    #scrap_container {
      background: rgba(255, 51, 102, 0.08);
      border: 1px solid rgba(ff, 51, 102, 0.3);
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
    }
    #scrap_container label { color: var(--danger-red); }
  </style>
</head>
<body>

  <!-- Barra Terminal -->
  <div class="top-bar">
    <span class="title">⚡ QUALITY HUD // RE1Q01</span>
    <span class="status">SYSTEM ONLINE</span>
  </div>

  <div class="card">
    <h2>🛠️ REGISTRO DE INSPECCIÓN</h2>
    
    <button class="btn-qr" onclick="scanQR()">📷 ESCANEAR QR DE RACK / LOTE</button>

    <label>Orden de Compra / Trabajo (OC):</label>
    <input type="text" id="orden" placeholder="Ej. OC085553">

    <!-- Número de Parte con Sugerencias -->
    <label>Número de Parte (Autocompletar):</label>
    <input type="text" id="parte" list="partes_list" placeholder="Escribe o selecciona ej. 741000412">
    <datalist id="partes_list">
      <option value="741000135">741000135 - C-PLT-ASY 19X21 08VL PTP</option>
      <option value="741000136">741000136 - C-PLT-ASY 19X21 6VLV 3+2+1</option>
      <option value="741000150">741000150 - C-PLT-ASY 13X20 6VLV 3+2+1</option>
      <option value="741000412">741000412 - C-PLT-ASY 19X21 08VL PTP</option>
    </datalist>

    <div class="row">
      <div class="col">
        <label>Origen (Línea):</label>
        <select id="origen">
          <option value="204122">204122 (Foundry)</option>
          <option value="204141">204141 (Assembly 41)</option>
          <option value="204126">204126 (Finishing)</option>
        </select>
      </div>
      <div class="col">
        <label>Rack Destino:</label>
        <select id="destino">
          <option value="F4RWK">F4RWK (Rework)</option>
          <option value="NC">NC (Non Conformance)</option>
          <option value="QA LAB">QA LAB (Auditoría)</option>
          <option value="MERHENRWK">MERHENRWK (Hopper)</option>
        </select>
      </div>
    </div>

    <!-- Defecto con Sugerencias -->
    <label>Defecto / Motivo de Retorno:</label>
    <input type="text" id="motivo_retorno" list="defectos_list" placeholder="Escribe ej. FUGA EN FITTING">
    <datalist id="defectos_list">
      <option value="FUGA EN FITTING">
      <option value="Ajuste de proceso">
      <option value="CORAZON DE ARENA ROTO">
      <option value="Linea expuesta en cara de hielo">
      <option value="POROSIDAD EN CUERPO">
    </datalist>

    <!-- Causa Raíz con Sugerencias -->
    <label>Causa Raíz:</label>
    <input type="text" id="causa_raiz" list="causas_list" placeholder="Escribe ej. MALA SOLDADURA">
    <datalist id="causas_list">
      <option value="MALA SOLDADURA">
      <option value="DRENAJE CON REBABA DE SOLDADURA">
      <option value="FALTA DE PASTA EN EL DRENAJE">
      <option value="DRENAJE DESALINEADO">
      <option value="PLATO NO ENTRA EN EL MOLDE DE FOAM">
    </datalist>

    <div class="row">
      <div class="col">
        <label>Piezas en Rack:</label>
        <input type="number" id="qty_rack" value="50">
      </div>
      <div class="col">
        <label>Buenas:</label>
        <input type="number" id="buenos" value="47">
      </div>
      <div class="col">
        <label>Malas:</label>
        <input type="number" id="malos" value="3">
      </div>
    </div>

    <label>Disposición Final:</label>
    <select id="disposicion" onchange="toggleScrapReason()">
      <option value="RETRABAJAR">🛠 RETRABAJAR</option>
      <option value="SCRAP">🗑 SCRAP (Desecho Definitivo)</option>
    </select>

    <div id="scrap_container" style="display: none;">
      <label>Motivo de Scrap Obligatorio:</label>
      <select id="motivo_scrap">
        <option value="GRIETAS EN FUNDICION">GRIETAS EN FUNDICION</option>
        <option value="POROSIDAD PROFUNDA">POROSIDAD PROFUNDA</option>
        <option value="DIMENSION CHICA NO RECUPERABLE">DIMENSION CHICA NO RECUPERABLE</option>
        <option value="DAÑO MECANICO SEVERO">DAÑO MECANICO SEVERO</option>
      </select>
    </div>

    <label>Estampa Inspector:</label>
    <input type="text" id="estampa" value="e2" placeholder="Ej. e2">

    <button class="btn-submit" onclick="sendToBot()">💾 GUARDAR EN SISTEMA</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function toggleScrapReason() {
      const disp = document.getElementById("disposicion").value;
      document.getElementById("scrap_container").style.display = (disp === "SCRAP") ? "block" : "none";
    }

    function scanQR() {
      tg.showScanQrPopup({ text: "Apunta al código QR del Rack / Lote" }, function(text) {
        if (text) {
          document.getElementById("orden").value = text;
          tg.closeScanQrPopup();
        }
      });
    }

    function sendToBot() {
      const payload = {
        orden: document.getElementById("orden").value || "OC_PENDIENTE",
        parte: document.getElementById("parte").value,
        origen: document.getElementById("origen").value,
        destino: document.getElementById("destino").value,
        motivo_retorno: document.getElementById("motivo_retorno").value,
        causa_raiz: document.getElementById("causa_raiz").value,
        qty_rack: parseInt(document.getElementById("qty_rack").value) || 0,
        buenos: parseInt(document.getElementById("buenos").value) || 0,
        malos: parseInt(document.getElementById("malos").value) || 0,
        disposicion: document.getElementById("disposicion").value,
        motivo_scrap: document.getElementById("disposicion").value === "SCRAP" ? document.getElementById("motivo_scrap").value : "N/A",
        estampa: document.getElementById("estampa").value
      };

      tg.sendData(JSON.stringify(payload));
    }
  </script>
</body>
</html>
